<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ABIED">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ABIED">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ABIED</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background:#0F1526; margin:0; height:100%; }

    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(ellipse at center, #141b30 0%, #0F1526 70%);
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #app-loading.fade-out { opacity: 0; pointer-events: none; }

    #app-loading .monitor {
      width: min(320px, 70vw);
      height: 90px;
      position: relative;
    }
    #app-loading svg { width: 100%; height: 100%; overflow: visible; }

    #app-loading .beat-path {
      fill: none;
      stroke: #8FC7E8;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(143, 199, 232, 0.65));
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: draw-beat 1.6s ease-in-out infinite;
    }
    #app-loading .baseline {
      stroke: rgba(143, 199, 232, 0.15);
      stroke-width: 1;
    }
    #app-loading .dot {
      fill: #BEE0F5;
      filter: drop-shadow(0 0 5px rgba(190, 224, 245, 0.9));
      offset-path: path('M0,45 L60,45 L75,15 L90,75 L105,45 L400,45');
      animation: travel 1.6s linear infinite;
    }

    @keyframes draw-beat {
      0%   { stroke-dashoffset: 400; opacity: 0.4; }
      45%  { stroke-dashoffset: 0;   opacity: 1; }
      55%  { stroke-dashoffset: 0;   opacity: 1; }
      100% { stroke-dashoffset: -400; opacity: 0.4; }
    }
    @keyframes travel {
      0%   { offset-distance: 0%; opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    #app-loading .label {
      color: #E7D9B4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.75;
    }
    #app-loading .label .dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }
    #app-loading .label .dots span:nth-child(2) { animation-delay: 0.2s; }
    #app-loading .label .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 20% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="monitor">
      <svg viewBox="0 0 400 90" preserveAspectRatio="none">
        <line class="baseline" x1="0" y1="45" x2="400" y2="45" />
        <path class="beat-path"
          d="M0,45 L60,45 L75,15 L90,75 L105,45 L130,45 L145,25 L155,55 L165,40 L180,45 L400,45" />
        <circle class="dot" r="3.5" />
      </svg>
    </div>
    <div class="label">Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 500);
      }
    });
  </script>
</body>
</html>
